name: CodeQL

# GitHub code scanning: the C# (src/, tests/, bench/) and the GitHub Actions workflows. Results show under
# Security → Code scanning; docs/development/code-analysis.md.
#
# Code scanning is free for public repositories. A private one needs GitHub Advanced Security, so the analysis is
# skipped while the repository is private (pushes and pull requests carry the repository's visibility). A scheduled
# run has no repository in its event, so it waits for the repository variable PUBLIC_REPO = true instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1' # Monday morning: new queries find things in code that didn't change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    if: (github.event_name == 'schedule' && vars.PUBLIC_REPO == 'true') || github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results
      actions: read # the workflow run's details (needed for private repositories)
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode none: CodeQL reads the C# without compiling it, so the analysis needs no SDL3, FreeType or
          # HarfBuzz and no Native AOT publish. It still restores the NuGet packages (TUnit), which needs the SDK
          # global.json asks for.
          - language: csharp
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
